button, a, input, .coin { touch-action: manipulation; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(900px 420px at 80% -120px, color-mix(in srgb, var(--gold) 18%, transparent), transparent 70%),
              radial-gradient(700px 380px at 0% 10%, color-mix(in srgb, var(--money) 14%, transparent), transparent 70%), var(--bg);
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--money) 60%, transparent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
/* Barres fixes : le contenu commence juste sous l'en-tête et finit au-dessus des onglets (hauteurs réelles mesurées en JS). */
:root { --top-h: calc(env(safe-area-inset-top, 0px) + 64px); --nav-h: calc(env(safe-area-inset-bottom, 0px) + 66px); }
html { scroll-padding-top: calc(var(--top-h) + 8px); scroll-padding-bottom: calc(var(--nav-h) + 8px); }
#app { max-width: 520px; margin: 0 auto; padding-block: calc(var(--top-h) + 10px) calc(var(--nav-h) + 26px); }

/* En-tête : pleine largeur, fond qui monte derrière la barre d'état iOS et se fond dans la page par un dégradé. */
.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 8;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px), calc((100% - 520px) / 2)) 12px max(16px, env(safe-area-inset-left, 0px), calc((100% - 520px) / 2));
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
}
.top::after, .nav::before { content: ""; position: absolute; left: 0; right: 0; height: 22px; pointer-events: none; }
.top::after { top: 100%; background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 86%, transparent), color-mix(in srgb, var(--bg) 0%, transparent)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; overflow: hidden; padding: 10px; margin: -10px; }   /* marge : l'ombre du logo n'est pas coupée */
.logo { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(140deg, var(--money), color-mix(in srgb, var(--money) 55%, var(--gold))); box-shadow: 0 6px 16px color-mix(in srgb, var(--money) 35%, transparent); }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: -.02em; white-space: nowrap; }
.balance-pill { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; flex: none; text-align: right; }
.balance-pill b, .balance-pill span { white-space: nowrap; }
.balance-pill b { font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.balance-pill span { font-size: 12px; color: var(--money); font-weight: 600; }

/* Titres d'écran */
.screen { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }
.screen-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.screen-title h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 28px; letter-spacing: -.025em; }
.screen-title span { font-size: 13px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* Carte bancaire */
.bank {
  position: relative; overflow: hidden; border-radius: 24px; padding: 22px 22px 20px; color: #FFFFFF;
  background: linear-gradient(125deg, #0C4F3A 0%, #138A5C 52%, #D79A2B 130%);
  box-shadow: 0 18px 40px rgba(12, 79, 58, .35), inset 0 1px 0 rgba(255, 255, 255, .18);
  aspect-ratio: 1.66; width: 100%; min-width: 0; max-width: 100%; display: flex; flex-direction: column; justify-content: space-between;
}
.bank::before { content: ""; position: absolute; width: 340px; height: 340px; right: -120px; top: -150px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .22), transparent 65%); }
.bank::after { content: ""; position: absolute; width: 260px; height: 260px; left: -90px; bottom: -150px; border-radius: 50%; border: 36px solid rgba(255, 255, 255, .06); }
.bank > * { position: relative; z-index: 1; }
.bank-top { display: flex; justify-content: space-between; align-items: center; }
.bank-top b { font-family: var(--f-display); font-weight: 800; letter-spacing: .04em; font-size: 15px; text-transform: uppercase; }
.chip { width: 44px; height: 32px; border-radius: 7px; background: linear-gradient(135deg, #F7DE8E, #C9952F); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); position: relative; }
.chip::before { content: ""; position: absolute; inset: 7px 14px; border: 1px solid rgba(0, 0, 0, .25); border-radius: 3px; }
.bank-amt span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .8; font-weight: 600; }
.bank-amt b { display: block; font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 9vw, 42px); letter-spacing: -.02em; line-height: 1.05; margin-top: 2px; }
.bank-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; font-size: 12.5px; }
.bank-bottom small { display: block; opacity: .75; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
.bank-bottom b { font-weight: 700; font-size: 14px; }
.bank-num { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .14em; opacity: .85; font-size: 13px; }

/* Zone de clic */
.clickzone { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 16px 18px; overflow: hidden; }
.coin {
  position: relative; width: 168px; height: 168px; border-radius: 50%; border: 0;
  background: radial-gradient(circle at 35% 30%, #FFE7A3, #F2B640 45%, #C98A1C 100%);
  box-shadow: 0 14px 30px color-mix(in srgb, var(--gold) 45%, transparent), inset 0 -8px 0 rgba(0, 0, 0, .12), inset 0 6px 0 rgba(255, 255, 255, .35);
  display: grid; place-items: center; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  transition: transform .08s ease;
}
.coin::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 3px dashed rgba(122, 76, 8, .35); }
.coin span { font-family: var(--f-display); font-weight: 800; font-size: 74px; color: #7A4C08; text-shadow: 0 2px 0 rgba(255, 255, 255, .45); line-height: 1; }
.coin.press { transform: scale(.94); }
.coin.boost { box-shadow: 0 0 0 6px color-mix(in srgb, var(--coral) 35%, transparent), 0 14px 34px color-mix(in srgb, var(--coral) 55%, transparent), inset 0 -8px 0 rgba(0, 0, 0, .12); }
.ring { position: absolute; left: 50%; top: 106px; width: 168px; height: 168px; margin: -84px 0 0 -84px; border-radius: 50%; border: 3px solid var(--gold); pointer-events: none; animation: ring .5s ease-out forwards; }
@keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.35); opacity: 0; } }
.fly { position: absolute; pointer-events: none; font-family: var(--f-display); font-weight: 800; font-size: 20px; color: var(--money); text-shadow: 0 2px 0 var(--surface); animation: fly .9s cubic-bezier(.2, .7, .3, 1) forwards; white-space: nowrap; }
.fly.x5 { color: var(--coral); font-size: 24px; }
@keyframes fly { 0% { transform: translate(-50%, 0) scale(.8); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -12px) scale(1.05); } 100% { transform: translate(-50%, -90px) scale(1); opacity: 0; } }
.click-hint { text-align: center; }
.click-hint b { font-family: var(--f-display); font-size: 22px; font-weight: 800; }
.click-hint span { display: block; color: var(--muted); font-size: 13px; }
.badge-boost { position: absolute; top: 14px; right: 14px; padding: 5px 10px; border-radius: 999px; background: var(--coral); color: #FFFFFF; font-weight: 700; font-size: 12px; }

/* Barres, boutons */
.bar { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--money), var(--gold)); transition: width .3s ease; }
.btn { border: 0; border-radius: 14px; padding: 11px 16px; font-weight: 700; font-size: 14px; background: var(--surface-2); color: var(--ink); transition: transform .1s ease, filter .15s ease, opacity .15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:active:not(:disabled) { transform: scale(.96); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.go { background: var(--money); color: #FFFFFF; box-shadow: 0 6px 14px color-mix(in srgb, var(--money) 35%, transparent); }
.btn.gold { background: var(--gold); color: #3A2604; }
.btn.coral { background: var(--coral); color: #FFFFFF; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 12px; }
.btn.full { width: 100%; }

.lvl-card { display: flex; flex-direction: column; gap: 12px; }
.lvl-top { display: flex; align-items: center; gap: 12px; }
.lvl-badge { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; background: color-mix(in srgb, var(--money) 14%, var(--surface)); color: var(--money); font-family: var(--f-display); font-weight: 800; font-size: 20px; flex: none; }
.lvl-top div { flex: 1; min-width: 0; }
.lvl-top b { display: block; font-weight: 700; }
.ad-card { background: linear-gradient(130deg, color-mix(in srgb, var(--coral) 92%, #000), color-mix(in srgb, var(--rose) 85%, var(--coral))); color: #FFFFFF; border: 0; display: flex; align-items: center; gap: 14px; }
.ad-card .ico { width: 48px; height: 48px; border-radius: 15px; background: rgba(255, 255, 255, .18); display: grid; place-items: center; font-size: 24px; flex: none; }
.ad-card div { flex: 1; min-width: 0; }
.ad-card b { display: block; font-family: var(--f-display); font-size: 17px; font-weight: 800; }
.ad-card span { font-size: 13px; opacity: .9; }
.ad-card .btn { background: #FFFFFF; color: #B33A22; }
.goal { display: flex; align-items: center; gap: 12px; }
.goal .ico { font-size: 26px; width: 48px; height: 48px; display: grid; place-items: center; background: var(--surface-2); border-radius: 15px; flex: none; }
.goal div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.income-split { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.income-split div { background: var(--surface-2); border-radius: 14px; padding: 10px; min-width: 0; }
.income-split small { display: block; font-size: 11px; color: var(--muted); }
.income-split b { font-size: 14px; white-space: nowrap; }

/* Segments */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 16px; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 10px 6px; border-radius: 12px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.qty { display: flex; gap: 6px; flex-wrap: wrap; }
.qty button { border: 1.5px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; }
.lang-row { flex-wrap: wrap; gap: 8px; }
.flag { width: 19px; height: 13px; border-radius: 2px; vertical-align: -2px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .12); flex: none; }
.lang-sw button { display: inline-flex; align-items: center; gap: 6px; }
.sp-lang { display: flex; gap: 10px; justify-content: center; margin: -6px 0 14px; animation: spFade .6s .3s both; }
.sp-lang button { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; border: 1.5px solid rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .06); color: #EAF2EC; font-weight: 700; font-size: 14px; }
.sp-lang button[aria-pressed="true"] { border-color: #F2CF7A; background: rgba(242, 207, 122, .16); color: #FFF1C4; }
.qty button[aria-pressed="true"] { border-color: var(--money); background: color-mix(in srgb, var(--money) 12%, var(--surface)); color: var(--money); }

/* Listes d'actifs */
.list { display: flex; flex-direction: column; gap: 12px; }
.asset { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.asset-head { display: flex; align-items: center; gap: 12px; }
.ico-tile { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; flex: none; background: color-mix(in srgb, var(--cc, var(--money)) 14%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cc, var(--money)) 22%, transparent); }
.asset-name { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.asset-name b { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.asset-name small { color: var(--muted); font-size: 12px; }
.asset-price { text-align: right; flex: none; }
.asset-price b { display: block; font-weight: 800; font-size: 16px; }
.chg { font-size: 12px; font-weight: 700; }
.chg.up { color: var(--pos); } .chg.down { color: var(--neg); }
.spark { width: 100%; height: 44px; display: block; }
.asset-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.asset-meta b { color: var(--ink); font-weight: 700; }
.asset-actions { display: flex; gap: 8px; }
.asset-actions .btn { flex: 1; }
.short { opacity: .72; filter: saturate(.55); }
.need { font-size: 12.5px; font-weight: 700; color: var(--coral); }
.need:empty { display: none; }
.btn.wrap { white-space: normal; flex-wrap: wrap; line-height: 1.3; }
.bico { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; flex: none; background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--cc) 38%, var(--surface)), color-mix(in srgb, var(--cc) 16%, var(--surface))); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--cc) 40%, transparent), 0 4px 10px color-mix(in srgb, var(--cc) 22%, transparent); }
.bico.lg { width: 64px; height: 64px; font-size: 32px; }
.found-cta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.found-cta > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.found-cta b { font-family: var(--f-display); font-size: 18px; font-weight: 800; }
.slots { display: flex; gap: 4px; margin-top: 6px; }
.slots i { width: 16px; height: 6px; border-radius: 3px; background: var(--surface-2); }
.slots i.on { background: var(--gold); }
.empty { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 18px; }
.empty .big { font-size: 42px; }
.empty b { font-family: var(--f-display); font-size: 18px; font-weight: 800; }
.back { position: relative; z-index: 2; border: 1.5px solid var(--line); background: var(--surface); width: 44px; height: 44px; border-radius: 50%; font-size: 18px; font-weight: 700; flex: none; align-self: center; }
.back::after { content: ""; position: absolute; inset: -6px; }   /* zone tactile élargie à 56 px */
/* Barre de titre des sous-pages : reste collée sous l'en-tête, la flèche retour est toujours visible et touchable. */
.screen-title.with-back { justify-content: flex-start; align-items: center; position: sticky; top: var(--top-h); z-index: 7;
  padding-block: 6px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
#main.swiping { transition: none; }
#main.swipe-end { transition: transform .22s ease, opacity .22s ease; }
.screen-title.with-back h1 { flex: 1; font-size: 23px; }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bcard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5px; color: var(--ink); transition: transform .1s ease, opacity .2s, filter .2s; }
.bcard:active { transform: scale(.97); }
.bcard > b { font-weight: 700; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.bcard .from { font-size: 12px; color: var(--muted); }
.bcard .from b { display: block; color: var(--ink); font-size: 15px; font-weight: 800; }
.bcard .yield { font-size: 12.5px; font-weight: 700; color: var(--money); }
.tierchip { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tierchip.t1 { color: var(--teal); } .tierchip.t2 { color: var(--sky); } .tierchip.t3 { color: var(--plum); }
.pl { display: flex; flex-direction: column; gap: 6px; font-size: 13px; text-align: left; }
.pl > div { display: flex; justify-content: space-between; gap: 10px; }
.pl > div span { color: var(--muted); }
.pl > div b { font-weight: 700; white-space: nowrap; }
.pl .minus b { color: var(--neg); }
.pl .net { border-top: 1px dashed var(--line); padding-top: 6px; }
.pl .net span, .pl .net b { color: var(--money); font-weight: 800; }
.pl .net.loss span, .pl .net.loss b { color: var(--neg); }
details.plbox { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; }
details.plbox summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
details.plbox summary::-webkit-details-marker { display: none; }
details.plbox summary::after { content: '▾'; transition: transform .2s; }
details.plbox[open] summary::after { transform: rotate(180deg); }
details.plbox[open] summary { margin-bottom: 8px; }
.team-line { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.team-line b { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipx { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chipx.warn { color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--surface)); }
.chipx.bad { color: var(--neg); background: color-mix(in srgb, var(--neg) 14%, var(--surface)); }
.chipx.good { color: var(--money); background: color-mix(in srgb, var(--money) 14%, var(--surface)); }
.meter { display: block; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; transition: width .3s; }
.firm-hero { display: flex; align-items: center; gap: 14px; }
.firm-hero > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.big-net { font-family: var(--f-display); font-weight: 800; font-size: 28px; letter-spacing: -.02em; }
.strike { border-color: color-mix(in srgb, var(--neg) 50%, var(--line)); display: flex; flex-direction: column; gap: 8px; }
.strike b { color: var(--neg); font-family: var(--f-display); font-size: 17px; }
.strike span { font-size: 13px; color: var(--muted); }
.good-note { margin: 10px 0 0; font-size: 13px; font-weight: 700; color: var(--money); }
.team { display: flex; flex-direction: column; gap: 12px; }
.team .stats .meter { margin-top: 6px; }
.emps { display: flex; flex-direction: column; gap: 8px; }
.emp, .cand { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: var(--surface-2); border: 0; color: var(--ink); text-align: left; width: 100%; }
.emp-av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 17px; color: #FFFFFF; background: linear-gradient(140deg, var(--cc), color-mix(in srgb, var(--cc) 60%, #000)); }
.emp-av.lg { width: 60px; height: 60px; font-size: 26px; }
.emp-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.emp-main b { font-weight: 700; font-size: 14.5px; }
.emp-main small { color: var(--muted); font-size: 12px; }
.emp-main .chipx { align-self: flex-start; }
.emp-bars { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.emp-sal { font-weight: 800; font-size: 14px; white-space: nowrap; text-align: right; }
.emp-sal small { color: var(--muted); font-weight: 600; }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 12px; }
.ask { font-style: normal; }
.mgr { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; border: 1.5px dashed var(--line); }
.mgr > span { flex: 1; min-width: 0; font-size: 13.5px; }
.mgr small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.log { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0 8px 12px; border-top: 1px solid var(--line); font-size: 13px; position: relative; }
.log li:first-child { border-top: 0; }
.log li::before { content: ''; position: absolute; left: 0; top: 14px; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.log li.good::before { background: var(--money); } .log li.bad::before { background: var(--neg); } .log li.warn::before { background: var(--gold); }
.log small { color: var(--muted); white-space: nowrap; font-size: 11.5px; }

'use strict';

/* ================= Langues (français / anglais) ================= */
// Chaque texte du jeu est une clé du dictionnaire I18N : clé → [français, anglais].
// tl(clé, ...valeurs) renvoie un texte « paresseux » : il s'écrit dans la langue courante au moment où il s'affiche

const TAX = .15;

const liq1 = id => SBY[id] ? SBY[id].cap * 1000 : S.mk[id].p * CBY[id].sup * 3e-6;   // livret : liquidité infinie, aucun impact
const impactOf = (id, v) => Math.min(.5, v / liq1(id) / 100);
// Courtage : 0,5 % (0,3 % en crypto), puis 1 % et 2 % si l'on achète et revend sans arrêt ; retour au tarif normal après 30 min sans transaction.
// ETF et obligations : 0,2 % ; livret : aucun frais.

function feeRate(id, t = Date.now()) {

  const part = own ? (S.basis[id] || 0) * Math.min(q, own) / own : 0, gain = gross - fee - part, tax = Math.max(0, gain) * TAX;

function qtyFor(id, A) {
  const p = S.mk[id].p, L = liq1(id), B = A / (1 + feeRate(id));
  if (!isFinite(L)) return Math.max(0, B / p);

}

function addInfo(o, t = Date.now()) {

  S.info.unshift(info);
  if (S.info.length > 50) S.info.length = 50;
  S.unread = Math.min(99, (S.unread || 0) + 1);
  if (!simQuiet && !document.hidden && S.unl.news) toast(`${ICATS[o.cat][1]} ${o.title}`, 'info');

}
function publish(tp, c, t, prefix) {

  for (const x of r.fx) S.fx.push({ ...x, from: t, until });
  if (r.shock) for (const d of [...SECS, ...CRYPTO]) if (d.beta) S.mk[d.id].a *= Math.pow(r.shock, d.beta);
  let opp = 0;
  if (r.opp) { opp = ++S.uid; S.opps.push({ ...r.opp, id: opp, until }); }
  addInfo({ cat: tp.cat, title: (prefix || '') + r.title, text: r.text, eff: r.opp ? r.eff : tl('pendant', r.eff, hTxt(r.dur)), until: r.opp ? 0 : until, opp }, t);
  if (r.infl) setInfl(S.infl + r.infl, t, r.infl < 0 ? tl('la_hausse_des_taux_devrait_freiner') : tl('le_credit_moins_cher_relance_la'));
}

function maybeInfo(now) {
  for (const r of [...S.rumors]) if (r.at <= now) {
    S.rumors = S.rumors.filter(x => x !== r);
    const tp = ITPL.find(x => x.k === r.k);
    if (r.ok) publish(tp, r.c, now, `${tl('confirme')} `);
    else addInfo({ cat: tp.cat, title: `${tl('dementi')} ` + tp.rumor(r.c).replace(/\.$/, ''), text: tl('linformation_ne_sest_pas_confirmee_fauss'), eff: tl('aucun_effet') }, now);
  }
  if (now < S.nextInfo || document.hidden) return;
  S.nextInfo = now + rf(5, 15) * 60e3;
  S.fx = S.fx.filter(x => x.until > now);
  let r = Math.random() * ITPL.reduce((a, x) => a + x.w, 0), tp = ITPL[0];
  for (const x of ITPL) if ((r -= x.w) < 0) { tp = x; break; }
  const c = tp.ctx();
  if (tp.rumor && (tp.force || Math.random() < .25)) {
    S.rumors.push({ k: tp.k, c, at: now + rf(5, 15) * 60e3, ok: Math.random() < (tp.force ? .5 : .6) });
    addInfo({ cat: tp.cat, title: `${tl('rumeur')} ` + tp.rumor(c).replace(/\.$/, ''), text: tl('rien_nest_confirme_pour_linstant_a'), eff: tl('aucun_effet_pour_linstant'), rumor: 1 }, now);
  } else publish(tp, c, now);
}

function lossLog(t, ico, title, amount, tip) {

// Assurances : prime horaire en part de la valeur assurée ; franchise de 10 % sur chaque sinistre.
const INS = { biz: [tl('business'), '🏢', .0012, tl('cambriolage_incendie_degat_des_eaux_dans')], veh: [tl('vehicules'), '🚗', .0035, tl('accidents_de_vos_taxis_camions_et')], immo: [tl('immobilier'), '🏠', .0005, tl('degats_des_eaux_et_incendies_dans')], lux: [tl('biens_de_luxe'), '💎', .0007, tl('vol_de_vos_voitures_bateaux_avions')] };
const FRANCHISE = .1;
function insValue(k) {
  if (k === 'biz') return S.firms.reduce((a, f) => a + firmValue(f), 0);
  if (k === 'veh') return S.firms.reduce((a, f) => a + (f.ops ? f.ops.veh.reduce((b, v) => b + v.v, 0) : 0), 0);
  if (k === 'immo') return S.props.reduce((a, pr) => a + propValue(pr), 0);
  return allItems().reduce((a, it) => a + (S.owned[it[0]] ? ipx(it) : 0), 0);
}
const insCost = k => insValue(k) * INS[k][2];

function claim(k, loss, t, title, logTo) {
  const insured = S.ins[k], pay = insured ? loss * FRANCHISE : loss;
  S.cash = Math.max(0, S.cash - pay);
  const msg = insured ? tl('de_degats_assure_vous_ne_payez', title, eur(loss), eur(pay)) : tl('de_degats_entierement_a_votre_charge', title, eur(loss), INS[k][0].toLowerCase());

  if (!simQuiet) toast(msg, insured ? '' : 'crash');
}
function riskSim(dtH, t) {
  const p = r => Math.random() < r * dtH;
  for (const f of S.firms) {
    const d = bizById(f.t), name = firmName(f), lf = (m, k) => logF(f, m, k, t), v = () => firmValue(f, t);
    if (p(.01)) claim('biz', .03 * v(), t, tl('cambriolage_chez', name), lf);
    else if (p(.002)) { claim('biz', .25 * v(), t, tl('incendie_chez', name), lf); S.fx.push({ u: f.u, m: 0, from: t, until: t + 6 * H, label: tl('ferme_apres_incendie') }); }
    else if (p(.006)) { claim('biz', .05 * v(), t, tl('degat_des_eaux_chez', name), lf); S.fx.push({ u: f.u, m: .5, from: t, until: t + 2 * H, label: tl('degat_des_eaux') }); }
    if (f.ops) for (const vh of f.ops.veh) if (vh.wear < 100 && p(.01)) { vh.wear = 100; vh.down = 1; claim('veh', .3 * vh.p0, t, tl('accident_de', OPS[d.id].veh[vh.k][1].toLowerCase(), name), lf); }
    // Procès : salarié mal payé ou épuisé, clients très mécontents
    if (!S.pending.some(x => x.f === f.u)) {
      const e = f.staff.find(e => e.mood < 25 || e.fat > 85);
      if (e && p(.006)) S.pending.push({ k: 'suit', f: f.u, who: e.n, emp: 1, claim: e.sal * 30, odds: e.sal < mktWage(d, e.sk, e.r) * .9 || e.fat > 85 ? .25 : .6 });
      else if (f.ops && f.ops.rating < 2.2 && p(.01)) S.pending.push({ k: 'suit', f: f.u, who: tl('un_client'), emp: 0, claim: Math.max(500 * S.pi, firmStats(f, t).ca * .5), odds: f.ops.rating < 1.8 ? .3 : .55 });
    }
  }
  for (const pr of S.props) {
    const lp = (m, k) => logP(pr, m, k, t);
    if (p(.006)) claim('immo', .03 * propValue(pr), t, tl('degat_des_eaux_2', propName(pr)), lp);
    else if (p(.0015)) { claim('immo', .2 * propValue(pr), t, tl('incendie', propName(pr)), lp); if (pr.tenant) { lp(tl('quitte_le_logement_sinistre', pr.tenant.n), 'bad'); pr.tenant = null; pr.vacant = t; } }
  }
  for (const it of allItems()) if (S.owned[it[0]] && p(.0006)) {
    const val = ipx(it);
    if (it[4] === 'home') claim('lux', .05 * val, t, tl('cambriolage_dans_votre_residence', it[1]));
    else { delete S.owned[it[0]]; const back = S.ins.lux ? val * (1 - FRANCHISE) : 0; S.cash += back; lossLog(t, '🦹', tl('vol', it[1]), val - back, S.ins.lux ? tl('assure_vous_avez_ete_rembourse_a') : tl('sans_assurance_le_bien_est_perdu', eur(insCost('lux')))); if (!simQuiet) toast(tl('vol_a_disparu', it[1], S.ins.lux ? ` ${tl('lassurance_vous_rembourse', eur(back))}` : ''), 'crash'); }
  }
  // Placements proposés dans les infos : arnaques et vraies opportunités
  for (const o of S.opps) if (o.amt && !o.done && o.payAt <= t) {
    o.done = 1;
    if (o.scam) lossLog(t, '🎣', tl('arnaque_perdus', o.name, eur(o.amt)), o.amt, tl('signes_dalerte_rendement_enorme_garanti'));
    else { const back = o.amt * (1 + o.ret), gain = back - o.amt, tax = Math.max(0, gain) * TAX; S.cash += back - tax; S.taxPaid += tax; if (gain < 0) lossLog(t, '📉', tl('perdus', o.name, eur(-gain)), -gain, tl('un_vrai_placement_comporte_toujours_un')); }
    if (!simQuiet) toast(o.scam ? tl('a_disparu_avec_votre_argent_cetait', o.name) : tl('vous_recuperez', o.name, eur(o.amt * (1 + o.ret))), o.scam ? 'crash' : o.ret >= 0 ? 'good' : '');
  }
  S.opps = S.opps.filter(o => !o.done && (o.amt || o.until > t));
}
// Faillite : un business qui perd de l'argent 16 h d'affilée ferme et ses biens sont liquidés à 20 %.
function bankruptcyCheck(f, net, dtH, t) {
  f.lossH = Math.max(0, (f.lossH || 0) + (net < 0 ? dtH : -2 * dtH));
  if (f.lossH >= 8 && !f.warned) { f.warned = 1; logF(f, tl('en_difficulte_perd_de_largent_depuis', firmName(f)), 'bad', t, true); }
  if (f.lossH < 4) f.warned = 0;
  if (f.lossH >= 16) {
    const back = f.s * .2; S.cash += back; f.bankrupt = 1;
    lossLog(t, '⚖️', tl('faillite_de', firmName(f)), f.s - back, tl('lentreprise_a_perdu_de_largent_16', eur(back)));
    if (!simQuiet) toast(tl('faillite_ferme_ses_portes', firmName(f)), 'crash');
  }
}

function netAt(d, l) { let n = dc(d) / d.pb; for (let i = 1; i < l; i++) n += upCost(d, i) / upPb(d); return n; }

// Comptes nominaux (équipe complète, compétence 2, humeur 75 %) : le bénéfice net vaut netAt().

function firmStats(f, t = Date.now()) {

  const cover = strike ? 0 : .6 * Math.max(0, need - present) / need * Math.min(1, present / need);
  // Sans personnel, l'entreprise ne produit rien ; les tout petits business (limonade…) sont tenus par le patron à 35 % d'un poste.

  const staffF = clamp((eff / need + cover) * vibe + owner, 0, 1.5);

/* ================= Sons, musique et effets ================= */
// Tout le son est synthétisé en Web Audio : aucun fichier, donc libre de droits.
// Effets → bus Effets ┐
// Musique → passe-bas « lo-fi » → bus Musique ┴→ petite réverbération + compresseur doux → haut-parleurs.
let AC = null, BUS = null, audioUnlocked = false;
const SND0 = { mOn: true, mVol: .35, fOn: true, fVol: .7 };

const musicOn = () => !S.mute && snd().mOn && snd().mVol > 0;
function audio() {
  if (AC) return AC;

  AC = new C();

  comp.threshold.value = -20; comp.knee.value = 14; comp.ratio.value = 3; comp.attack.value = .006; comp.release.value = .3;
  comp.connect(AC.destination);

  const len = Math.floor(AC.sampleRate * 1.6), ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5); }
  const rev = AC.createConvolver(); rev.buffer = ir; rev.connect(comp);
  const fx = AC.createGain(), mus = AC.createGain(), lo = AC.createBiquadFilter(), fxSend = AC.createGain(), musSend = AC.createGain();
  lo.type = 'lowpass'; lo.frequency.value = 2800; lo.Q.value = .4;
  fx.connect(comp); fx.connect(fxSend); fxSend.gain.value = .25; fxSend.connect(rev);
  mus.connect(lo); lo.connect(comp); lo.connect(musSend); musSend.gain.value = .4; musSend.connect(rev);
  fx.gain.value = 0; mus.gain.value = 0;
  BUS = { fx, mus };
  return AC;
}
// Volumes : courbe douce (carré du curseur) ; la musique reste nettement sous les effets.
function volSync() {
  if (!BUS) return;
  const t = AC.currentTime, o = snd(), quiet = document.hidden || adPause();
  BUS.fx.gain.setTargetAtTime(sfxOn() && !quiet ? 1.6 * o.fVol * o.fVol : 0, t, .02);
  BUS.mus.gain.setTargetAtTime(musicOn() && !quiet ? 3 * o.mVol * o.mVol : 0, t, .4);
}
// Le son ne peut démarrer qu'après un premier toucher (obligatoire sur iPhone).
function unlockAudio() {
  const a = audio(); if (!a) return;
  if (!audioUnlocked) {
    audioUnlocked = true;
    const b = a.createBuffer(1, 1, 22050), z = a.createBufferSource(); z.buffer = b; z.connect(a.destination); z.start(0);   // réveille les anciens iOS
  }

}
['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
// Arrière-plan ou pub en cours : tout est suspendu, puis reprend au retour.
function audioSync() {
  if (!AC || !audioUnlocked) return;
  const quiet = document.hidden || adPause();
  if (quiet) { if (AC.state === 'running') AC.suspend(); }
  else if (AC.state !== 'running') AC.resume();
  volSync();
  if (!quiet && musicOn()) Music.start(); else Music.stop();
}
document.addEventListener('visibilitychange', audioSync);

// --- Briques sonores ---
// Une note : attaque douce puis extinction exponentielle, éventuellement placée en stéréo.
function voice(bus, t, f, { type = 'sine', vol = .1, att = .005, dec = .4, detune = 0, pan = 0 } = {}) {
  const o = AC.createOscillator(), g = AC.createGain();

  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + att + dec);
  o.connect(g);
  if (pan && AC.createStereoPanner) { const p = AC.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(bus); } else g.connect(bus);

// Timbre de cloche ou de marimba : fondamentale + partiels qui s'éteignent plus vite. parts : [rapport, volume, durée].
const MARIMBA = [[1, 1, 1], [3.99, .1, .25], [9.8, .025, .1]];

const mid = m => 440 * Math.pow(2, (m - 69) / 12);   // numéro de note MIDI → fréquence

// Clics très rapides : 50 ms au moins entre deux tintements et 3 au plus en même temps.
const COIN_TIMBRES = [

  coin() {

    const f = pick([2093, 2217, 2349, 2489, 2637, 2794]) * rf(.985, 1.015) * (boosted() ? 1.05 : 1), dec = rf(.14, .24);

// --- Musique d'ambiance générative (lo-fi / jazz) ---
// Piano électrique en accords de 7e et 9e, basse ronde, batterie aux balais très douce, petites phrases de mélodie.
// Cinq grilles d'accords ; toutes les 8 mesures, nouvelle grille et nouvelle densité (pause, groove, groove + mélodie).
const PROGS = [
  [[50, [3, 7, 10, 14]], [55, [4, 10, 14, 21]], [48, [4, 7, 11, 14]], [57, [3, 7, 10, 14]]],   // Dm9 G13 Cmaj9 Am9
  [[53, [4, 7, 11, 14]], [52, [3, 7, 10, 14]], [50, [3, 7, 10, 14]], [55, [4, 10, 14, 17]]],   // Fmaj9 Em9 Dm9 G11
  [[45, [3, 7, 10, 14]], [50, [4, 10, 14, 19]], [43, [4, 7, 11, 14]], [48, [4, 7, 11, 14]]],   // Am9 D9 Gmaj9 Cmaj9
  [[51, [4, 7, 11, 14]], [50, [3, 7, 10, 14]], [48, [3, 7, 10, 14]], [46, [4, 10, 14, 21]]],   // Ebmaj9 Dm9 Cm9 Bb13
  [[48, [4, 7, 11, 14]], [45, [3, 7, 10, 14]], [53, [4, 7, 11, 14]], [55, [4, 10, 14, 17]]],   // Cmaj9 Am9 Fmaj9 G11
];
const BPM = 72;
function ep(t, m, vol, dec) {
  const f = mid(m), p = rf(-.25, .25);
  voice(BUS.mus, t, f, { vol, att: .012, dec, pan: p });

}
const Music = {
  on: false, next: 0, step: 0, bar: 0, prog: 0, sec: 0, mel: 72, timer: 0,
  start() {
    if (this.on || !AC || AC.state !== 'running') return;
    this.on = true; this.next = AC.currentTime + .15; this.step = 0; this.bar = 0; this.sec = 0;
    this.prog = Math.floor(Math.random() * PROGS.length);
    this.timer = setInterval(() => this.tick(), 120);
  },
  stop() { if (!this.on) return; this.on = false; clearInterval(this.timer); },
  tick() {
    if (!AC || AC.state !== 'running') return;

    while (this.next < AC.currentTime + .35) {
      this.play(this.step, this.next);
      this.next += e8 * (this.step % 2 ? .68 : 1.32);    // croches swinguées
      if (++this.step === 8) { this.step = 0; this.newBar(); }

  newBar() {

  play(st, t) {

    if (st === 0) notes.forEach((m, i) => ep(t + i * .012, m, .045, 2.6));
    else if ((st === 3 && Math.random() < .45) || (st === 6 && Math.random() < .3)) notes.slice(1).forEach(m => ep(t, m, .025, .9));
    // Basse : fondamentale, puis quinte, octave ou note d'approche de l'accord suivant.
    if (st === 0) { voice(BUS.mus, t, mid(root - 12), { vol: .16, att: .01, dec: 1.1 }); voice(BUS.mus, t, mid(root), { type: 'triangle', vol: .02, att: .01, dec: .5 }); }

    if (st === 7 && Math.random() < .35) voice(BUS.mus, t, mid(root - 10), { vol: .08, att: .01, dec: .3 });

      pool.sort((a, b) => Math.abs(a - this.mel) - Math.abs(b - this.mel));
      this.mel = pick(pool.slice(0, 3));
      ep(t, this.mel, .03, 1.1);
    }
    // Craquements de vinyle, très discrets.
    if (Math.random() < .25) noiseHit(BUS.mus, t + rf(0, .1), { vol: .004, dec: .01, f: 5000, q: .5, type: 'highpass' });
  },
};

  $('hdrIncome').style.color = inc < 0 ? 'var(--neg)' : '';
  $('hdrTok').textContent = S.tok;
  // Solde à zéro avec un revenu négatif : alerte permanente, le solde ne descend jamais sous 0.
  const broke = S.cash <= .01 && inc < 0, al = $('alertBar');
  al.hidden = !broke;
  if (broke) al.textContent = tl('votre_entreprise_perd_de_largent_solde', perH(inc));
  if (broke && !refresh.broke) toast(tl('votre_entreprise_perd_de_largent'), 'crash');
  refresh.broke = broke;
  const nbg = $('newsBadge'); nbg.hidden = !S.unread || tab === 'news'; nbg.textContent = S.unread;
  const gn = $('gClicks'); if (gn) gn.textContent = nf0.format(S.clicks);
  const gc = $('gCash'); if (gc) gc.textContent = eur(S.cash);
  const gi = $('gInc'); if (gi) { gi.textContent = perH(inc); gi.style.color = inc < 0 ? '#FFB4A8' : ''; }
  const gk = $('gClick'); if (gk) gk.textContent = '+' + eur(clickValue());
  const lb = $('lvlBar'); if (lb) lb.style.width = clamp(S.cash / clickCost(S.clickLvl) * 100, 0, 100) + '%';
  const gb = $('goalBar'); if (gb) { const t = +gb.dataset.target; gb.style.width = clamp((gb.closest('.goal').textContent.includes('fortune') ? fortune() : S.cash) / t * 100, 0, 100) + '%'; }
  document.querySelectorAll('#main [data-cost]').forEach(b => { b.disabled = S.cash < +b.dataset.cost; });
  const bb = $('boostBadge'); if (bb) { bb.hidden = !boosted(); const l = $('boostLeft'); if (l) l.textContent = mmss(S.boostUntil - Date.now()); }
  const at = $('adTxt'); if (at) at.textContent = adLabel();
  const ab = $('adBtn'); if (ab) ab.disabled = adLocked();
  const coin = $('coin'); if (coin) coin.classList.toggle('boost', boosted());
  // « Il vous manque X € » et cartes grisées tant que le solde ne suffit pas
  document.querySelectorAll('#main [data-need]').forEach(el => {
    const miss = +el.dataset.need - S.cash, txt = miss > 0 ? tl('il_vous_manque_2', eur(miss)) : '';
    if (el.textContent !== txt) el.textContent = txt;
    const c = el.closest('[data-shadeable]'); if (c) c.classList.toggle('short', miss > 0);
  });
  // Pastille : achat possible ou équipe qui a besoin de vous
  const has = new Set(S.firms.map(f => f.t)), now = Date.now();
  const canBiz = S.firms.some(f => (f.l < BIZ_MAX && !f.upEnd && S.cash >= upCost(bizById(f.t), f.l)) || (!f.mgr && (f.strike > now || f.staff.some(e => e.ask) || vacancies(f, bizById(f.t)).length))) || (S.firms.length < FIRMS_MAX && BIZ.some(d => !has.has(d.id) && S.cash >= dc(d)));
  const nb = document.querySelector('.nav [data-tab="biz"]');
  let dot = nb.querySelector('.dot');
  if (canBiz && tab !== 'biz' && !dot) { dot = document.createElement('span'); dot.className = 'dot'; nb.appendChild(dot); }
  if ((!canBiz || tab === 'biz') && dot) dot.remove();
}

let lastFrame = Date.now(), lastTick = Date.now(), lastSave = Date.now();
function loop() {
  audioSync();
  if (document.hidden) return;   // l'absence est rattrapée par offlineGains() au retour
  const now = Date.now(), dt = now - lastFrame;
  lastFrame = now;
  if (dt > 0 && dt < 5000) { simAll(dt / H, now); S.playMs += dt; }
  if (now - lastTick >= TICK_MS) {
    lastTick = now; marketTick(false); updateInvest(); maybeEvent(now); maybeInfo(now); checkDaily(); checkQuests(); checkAch(); checkUnlocks(); maybePending();
    if (tab === 'creator' && S.cr && $('modal').hidden) {
      const c = S.cr, cs = `${c.vids.length}:${c.n}:${c.offers.length}:${!!c.prod}:${c.log[0] ? c.log[0][0] : 0}:${c.burn > now}:${crView}:${crSort}:${crTab}:${crMet}:${Math.floor(now / (crView ? 1e4 : 2e4))}`;
      if (cs !== renderCreator.sig) { if (!scrolling()) { renderCreator.sig = cs; render(); } }
      else { const el = $('crSubs'); if (el) el.textContent = nf0.format(c.subs); if ($('cv-cr')) chartUpdate('cr', crSeries(c)); }
    }
    if (tab === 'news' && S.info.length && S.info[0].id !== renderNews.last && !scrolling()) { renderNews.last = S.info[0].id; render(); }
    // Les écrans Entreprises se redessinent quand il se passe quelque chose dans une équipe.
    const sig = S.firms.map(f => `${f.u}:${f.l}:${f.staff.length}:${f.log[0] ? f.log[0][0] : 0}:${f.strike > now}:${f.staff.filter(e => !isIn(e, now)).length}`).join('|');
    if (tab === 'biz' && bizView === 'firm' && firmTab === 'ops') updOps();
    if (sig !== bizSig && !scrolling()) { bizSig = sig; if (tab === 'biz' && bizView !== 'found' && $('modal').hidden) render(); }
  }
  if (now - lastSave >= 5000) { lastSave = now; save(); }
  checkStarter();
  if (renderLater && !scrolling()) { renderLater = false; render(); }
  refresh();
  coachTick();
}

// Chiffres en direct de l'écran Gestion, sans tout redessiner.
function updOps() {
  const f = findFirm(firmU); if (!f || !f.ops.ema || !$('kCa')) return;
  const st = firmStats(f), em = f.ops.ema;
  $('kCa').textContent = eur(em.ca); $('kCli').textContent = nf0.format(em.n); $('kLost').textContent = nf0.format(em.lost); $('kSat').textContent = Math.round(st.ops.sat * 100) + pc();
}
/* Gains pendant l'absence (plafonnés à 8 h) : les entreprises et leurs équipes continuent de vivre. */
function offlineGains() {
  const now = Date.now(), away = now - (S.last || now);
  if (away < 15000) return;
  marketAdvance(away, now);
  const hrs = Math.min(away / H, OFFLINE_CAP_H), steps = Math.max(1, Math.ceil(hrs / .1)), dtH = hrs / steps, t0 = now - hrs * H;
  const cash0 = S.cash, logs0 = S.firms.reduce((a, f) => a + f.log.filter(l => l[0] > S.last).length, 0);
  simQuiet = true;
  for (let i = 1; i <= steps; i++) simAll(dtH, t0 + i * dtH * H);
  simQuiet = false;
  lastFrame = now;
  const g = S.cash - cash0, news = S.firms.reduce((a, f) => a + f.log.filter(l => l[0] > S.last).length, 0) - logs0;
  if (Math.abs(g) < .01 && !news) return;
  const who = S.name && !isDefaultName(S.name) ? `, ${esc(S.name)}` : '';
  modal(`<div class="welcome"><span class="ev-ico">👋</span><h3>${tl('bon_retour', who)}</h3><p>${tl('pendant_votre_absence_vous_avez', dur(away), away / H > OFFLINE_CAP_H ? tl('dont_h_comptees', OFFLINE_CAP_H) : '', g >= 0 ? tl('gagne') : tl('w_perdu'))}</p>
    <span class="big num"${g < 0 ? ' style="color:var(--neg)"' : ''}>${eur(Math.abs(g))}</span>${news ? `<p>${tl('evenement_dans_vos_equipes_consultez_les', news, news > 1 ? 's' : '')}</p>` : ''}</div><div class="modal-actions"><button class="btn go" id="okBack" type="button">${tl('recuperer')}</button></div>`);
  $('okBack').onclick = () => { closeModal(); render(); };
}

$('tokBtn').addEventListener('click', () => tokModal());

$('sndBtn').addEventListener('click', toggleSound);
// Pas de zoom : pincement bloqué (événements gesture d'iOS) et double toucher hors des boutons et des champs.
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  const el = e.target instanceof Element ? e.target : null;
  if (now - lastTouchEnd < 320 && !(el && el.closest('button, a, input, select, textarea, label, [data-skip], .coin'))) e.preventDefault();

document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
$('newsBtn').addEventListener('click', () => { if (tab !== 'news') prevTab = tab; tab = 'news'; render(); window.scrollTo(0, 0); });
// Mode test caché : 5 appuis rapides sur l'avatar du Profil.

// Hauteurs réelles de l'en-tête et des onglets (zones de la barre d'état et de l'indicateur d'accueil comprises) :

window.addEventListener('resize', setTopH); window.addEventListener('orientationchange', () => setTimeout(setTopH, 300));
// Glisser depuis le bord gauche vers la droite : même effet que la flèche retour de la sous-page affichée.
const backBtn = () => $('main').querySelector('.screen-title.with-back .back');
let swipe = null;
document.addEventListener('touchstart', e => {
  const p = e.touches[0];
  swipe = e.touches.length === 1 && p.clientX <= 28 && $('modal').hidden && !splashOn && backBtn() ? { x: p.clientX, y: p.clientY, dx: 0, on: false } : null;
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!swipe) return;

}, { passive: true });
const swipeEnd = () => {

  swipe = null; m.classList.remove('swiping'); m.classList.add('swipe-end'); m.style.transform = ''; m.style.opacity = '';

/* ================= Démarrage ================= */
const VERSION = 'v1.0';
let splashOn = true;
let splashEnd = null, gameReady = false;
function runSplash(first) {
  $('spVer').textContent = VERSION;
  const msgs = [tl('ouverture_des_marches'), tl('calcul_de_vos_gains_hors_ligne'), tl('preparation_de_vos_entreprises')], el = $('spMsg');
  msgs.slice(1).forEach((m, i) => setTimeout(() => { el.classList.add('swap'); setTimeout(() => { el.textContent = m; el.classList.remove('swap'); }, 250); }, 800 * (i + 1)));
  const sl = $('spLang');
  if (first) {
    sl.hidden = false;
    const mark = () => sl.querySelectorAll('[data-splang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.splang === LANG)));
    mark();
    sl.addEventListener('click', e => {
      const b = e.target.closest('[data-splang]'); if (!b) return;
      LANG = b.dataset.splang; applyStatic(); mark();
      // La partie n'est enregistrée qu'une fois chargée (sur CrazyGames, la sauvegarde arrive après le SDK).
      if (gameReady) { S.lang = LANG; render(); save(); }
      setTimeout(() => splashEnd && splashEnd(), 450);
    });
  }
  let done = false;
  splashEnd = () => { if (done) return; done = true; $('splash').classList.add('gone'); splashOn = false; setTimeout(() => $('splash').remove(), 600); };
  setTimeout(splashEnd, first ? 4500 : 2600);
}
function start() {
  // Langue affichée dès l'écran de chargement : celle de la partie enregistrée, sinon l'anglais (choix possible sur cet écran).
  let firstRun = false;
  // Sauvegarde abîmée : gardée de côté telle quelle avant toute autre écriture.
  const rawMain = local.get(KEY);
  if (rawMain && !parseSave(rawMain) && local.get(KEY + '.corrupt') !== rawMain) local.set(KEY + '.corrupt', rawMain);
  try { const f = findSave(), d = f && f.d; firstRun = !d; LANG = firstRun ? 'en' : LANGS.includes(d.lang) ? d.lang : 'fr'; } catch (e) { LANG = 'en'; firstRun = true; }
  askPersist();
  applyStatic();
  runSplash(firstRun);
  if (!load()) S = defaultState();
  else offlineGains();
  gameReady = true;
  LANG = S.lang;
  applyStatic();
  render();
  save();
  // Après les éventuelles notifications du démarrage, pour qu'elle ne soit pas recouverte.
  if (loadedFrom !== KEY) setTimeout(() => toast(BAK.includes(loadedFrom) ? tl('sv_rec_bak') : tl('sv_rec_old'), 'good'), 3500);
  setInterval(loop, 250);
}
start();
