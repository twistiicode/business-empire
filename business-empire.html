<style>
/* Layout : une colonne d'application (520 px max), en-tête collant, barre d'onglets en bas ; la carte bancaire est le héros de l'écran Gains. */
:root {
  --bg: #F1F5F0;
  --surface: #FFFFFF;
  --surface-2: #E8EFE8;
  --ink: #14251D;
  --muted: #5A6B62;
  --line: #DCE6DD;
  --money: #17935F;
  --gold: #E9A92B;
  --coral: #FF6F4F;
  --sky: #3A7BEF;
  --plum: #8455E8;
  --rose: #E9558F;
  --teal: #12A3A0;
  --pos: #17935F;
  --neg: #D9443A;
  --shadow: 0 1px 2px rgba(20, 37, 29, .06), 0 10px 26px rgba(20, 37, 29, .07);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif;
  --r: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1713; --surface: #16231D; --surface-2: #1F2E27; --ink: #EFF6F2; --muted: #A9BBB1; --line: #2A3B33;
    --money: #3CCB8D; --gold: #F2BE52; --coral: #FF8A6E; --sky: #6FA0FF; --plum: #A787F5; --rose: #F27DAD; --teal: #3CC9C5;
    --pos: #3CCB8D; --neg: #FF7A70; --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1713; --surface: #16231D; --surface-2: #1F2E27; --ink: #EFF6F2; --muted: #A9BBB1; --line: #2A3B33;
  --money: #3CCB8D; --gold: #F2BE52; --coral: #FF8A6E; --sky: #6FA0FF; --plum: #A787F5; --rose: #F27DAD; --teal: #3CC9C5;
  --pos: #3CCB8D; --neg: #FF7A70; --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* Rien ne doit dépasser à droite (Safari iOS), pas de zoom involontaire au double toucher */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { max-width: 100%; overflow-x: clip; }
#app { width: 100%; min-width: 0; }
.screen > *, .top > * { min-width: 0; max-width: 100%; }
button, a, input, .coin { touch-action: manipulation; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(900px 420px at 80% -120px, color-mix(in srgb, var(--gold) 18%, transparent), transparent 70%),
              radial-gradient(700px 380px at 0% 10%, color-mix(in srgb, var(--money) 14%, transparent), transparent 70%), var(--bg);
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--money) 60%, transparent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
#app { max-width: 520px; margin: 0 auto; padding-block: 0 112px; }

/* En-tête */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; overflow: hidden; }
.logo { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(140deg, var(--money), color-mix(in srgb, var(--money) 55%, var(--gold))); box-shadow: 0 6px 16px color-mix(in srgb, var(--money) 35%, transparent); }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: -.02em; white-space: nowrap; }
.balance-pill { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; flex: none; text-align: right; }
.balance-pill b, .balance-pill span { white-space: nowrap; }
.balance-pill b { font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.balance-pill span { font-size: 12px; color: var(--money); font-weight: 600; }

/* Titres d'écran */
.screen { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }
.screen-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.screen-title h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 28px; letter-spacing: -.025em; }
.screen-title span { font-size: 13px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* Carte bancaire */
.bank {
  position: relative; overflow: hidden; border-radius: 24px; padding: 22px 22px 20px; color: #FFFFFF;
  background: linear-gradient(125deg, #0C4F3A 0%, #138A5C 52%, #D79A2B 130%);
  box-shadow: 0 18px 40px rgba(12, 79, 58, .35), inset 0 1px 0 rgba(255, 255, 255, .18);
  aspect-ratio: 1.66; width: 100%; min-width: 0; max-width: 100%; display: flex; flex-direction: column; justify-content: space-between;
}
.bank::before { content: ""; position: absolute; width: 340px; height: 340px; right: -120px; top: -150px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .22), transparent 65%); }
.bank::after { content: ""; position: absolute; width: 260px; height: 260px; left: -90px; bottom: -150px; border-radius: 50%; border: 36px solid rgba(255, 255, 255, .06); }
.bank > * { position: relative; z-index: 1; }
.bank-top { display: flex; justify-content: space-between; align-items: center; }
.bank-top b { font-family: var(--f-display); font-weight: 800; letter-spacing: .04em; font-size: 15px; text-transform: uppercase; }
.chip { width: 44px; height: 32px; border-radius: 7px; background: linear-gradient(135deg, #F7DE8E, #C9952F); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); position: relative; }
.chip::before { content: ""; position: absolute; inset: 7px 14px; border: 1px solid rgba(0, 0, 0, .25); border-radius: 3px; }
.bank-amt span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .8; font-weight: 600; }
.bank-amt b { display: block; font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 9vw, 42px); letter-spacing: -.02em; line-height: 1.05; margin-top: 2px; }
.bank-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; font-size: 12.5px; }
.bank-bottom small { display: block; opacity: .75; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
.bank-bottom b { font-weight: 700; font-size: 14px; }
.bank-num { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .14em; opacity: .85; font-size: 13px; }

/* Zone de clic */
.clickzone { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 16px 18px; overflow: hidden; }
.coin {
  position: relative; width: 168px; height: 168px; border-radius: 50%; border: 0;
  background: radial-gradient(circle at 35% 30%, #FFE7A3, #F2B640 45%, #C98A1C 100%);

function PAR(id, rugged, ih = Math.log(1.02) / 24) {

function step(m, P, n, sh = 0, t = 0, id = '') {

  m.imp = (m.imp || 0) * Math.exp(-n * TICK_MS / 18e4);
  m.p = Math.max(1e-7, m.a * Math.exp(m.x + m.imp) * (t ? afx(id, t) : 1));
}

function rec(hs, t, v) {
  const ts = Math.round(t / 1000), val = +(+v).toPrecision(6);
  for (const [k, iv, mx] of HT) {
    const arr = hs[k];
    if (!arr.length || ts - arr[arr.length - 1][0] >= iv / 1000) { arr.push([ts, val]); if (arr.length > mx) arr.shift(); }
  }
}

function seedAsset(id, now) {
  const P = PAR(id), m = { p: P.p0, a: P.p0, x: 0, H: emptyHist() };
  const segs = [[30 * 24 * H, H], [24 * H, 5 * 60e3], [H, 60e3]];
  let t = now - segs[0][0];
  for (let i = 0; i < segs.length; i++) {
    const end = i + 1 < segs.length ? now - segs[i + 1][0] : now, st = segs[i][1];
    while (t < end) { t += st; step(m, P, st / TICK_MS); rec(m.H, t, m.p); }
  }
  const f = P.p0 / m.p;
  m.a *= f; m.p = P.p0;
  for (const k in m.H) m.H[k].forEach(pt => pt[1] = +(pt[1] * f).toPrecision(6));
  return m;
}

function feeRate(id, t = Date.now()) {
  const base = CBY[id] ? FEE_C : FEE_S, r = S.rt[id];

function quote(id, side, q, t = Date.now()) {
  const m = S.mk[id], p = m.p, v = q * p, imp = impactOf(id, v), avg = p * (1 + (side === 'buy' ? 1 : -1) * imp / 2);
  const gross = q * avg, rate = feeRate(id, t), fee = gross * rate, own = holdOf(id);
  if (side === 'buy') return { p, avg, gross, fee, rate, imp, total: gross + fee };
  const part = own ? (S.basis[id] || 0) * Math.min(q, own) / own : 0, gain = gross - fee - part, tax = Math.max(0, gain) * TAX;
  return { p, avg, gross, fee, rate, imp, part, gain, tax, net: gross - fee - tax };
}

/* ================= Risques : assurances, sinistres, procès, faillites, arnaques ================= */
// Chaque perte est expliquée dans le journal des pertes (Profil) avec un conseil pour l'éviter.
function lossLog(t, ico, title, amount, tip) {
  S.losses.unshift([t, ico, title, amount, tip || '']);
  if (S.losses.length > 30) S.losses.length = 30;
}
// Assurances : prime horaire en part de la valeur assurée ; franchise de 10 % sur chaque sinistre.
const INS = { biz: ['Business', '🏢', .0012, 'Cambriolage, incendie, dégât des eaux dans vos entreprises'], veh: ['Véhicules', '🚗', .0035, 'Accidents de vos taxis, camions et avions'], immo: ['Immobilier', '🏠', .0005, 'Dégâts des eaux et incendies dans vos biens locatifs'], lux: ['Biens de luxe', '💎', .0007, 'Vol de vos voitures, bateaux, avions et objets de collection'] };
const FRANCHISE = .1;
function insValue(k) {
  if (k === 'biz') return S.firms.reduce((a, f) => a + firmValue(f), 0);
  if (k === 'veh') return S.firms.reduce((a, f) => a + (f.ops ? f.ops.veh.reduce((b, v) => b + v.v, 0) : 0), 0);
  if (k === 'immo') return S.props.reduce((a, pr) => a + propValue(pr), 0);
  return allItems().reduce((a, it) => a + (S.owned[it[0]] ? ipx(it) : 0), 0);
}
const insCost = k => insValue(k) * INS[k][2];
const insTotal = () => Object.keys(INS).reduce((a, k) => a + (S.ins[k] ? insCost(k) : 0), 0);
// Un sinistre : assuré, vous ne payez que la franchise ; sinon, tout est pour vous.
function claim(k, loss, t, title, logTo) {
  const insured = S.ins[k], pay = insured ? loss * FRANCHISE : loss;
  S.cash = Math.max(0, S.cash - pay);
  const msg = insured ? `${title} : ${eur(loss)} de dégâts. Assuré, vous ne payez que la franchise de ${eur(pay)}.` : `${title} : ${eur(loss)} de dégâts, entièrement à votre charge (pas d’assurance ${INS[k][0].toLowerCase()}).`;
  if (logTo) logTo(msg, insured ? 'warn' : 'bad');
  lossLog(t, INS[k][1], `${title}${insured ? ' (assuré)' : ''}`, pay, insured ? 'Votre assurance a couvert 90 % des dégâts.' : `L’assurance ${INS[k][0].toLowerCase()} coûterait environ ${eur(insCost(k))}/h et ne laisse que 10 % de franchise.`);
  if (!simQuiet) toast(msg, insured ? '' : 'crash');
}
function riskSim(dtH, t) {
  const p = r => Math.random() < r * dtH;

    const d = bizById(f.t), name = firmName(f), lf = (m, k) => logF(f, m, k, t), v = () => firmValue(f, t);
    if (p(.01)) claim('biz', .03 * v(), t, `Cambriolage chez ${name}`, lf);
    else if (p(.002)) { claim('biz', .25 * v(), t, `Incendie chez ${name}`, lf); S.fx.push({ u: f.u, m: 0, from: t, until: t + 6 * H, label: 'Fermé après incendie' }); }
    else if (p(.006)) { claim('biz', .05 * v(), t, `Dégât des eaux chez ${name}`, lf); S.fx.push({ u: f.u, m: .5, from: t, until: t + 2 * H, label: 'Dégât des eaux' }); }
    if (f.ops) for (const vh of f.ops.veh) if (vh.wear < 100 && p(.01)) { vh.wear = 100; vh.down = 1; claim('veh', .3 * vh.p0, t, `Accident : ${OPS[d.id].veh[vh.k][1].toLowerCase()} de ${name}`, lf); }
    // Procès : salarié mal payé ou épuisé, clients très mécontents
    if (!S.pending.some(x => x.f === f.u)) {
      const e = f.staff.find(e => e.mood < 25 || e.fat > 85);
      if (e && p(.006)) S.pending.push({ k: 'suit', f: f.u, who: e.n, emp: 1, claim: e.sal * 30, odds: e.sal < mktWage(d, e.sk) * .9 || e.fat > 85 ? .25 : .6 });
      else if (f.ops && f.ops.rating < 2.2 && p(.01)) S.pending.push({ k: 'suit', f: f.u, who: 'Un client', emp: 0, claim: Math.max(500 * S.pi, firmStats(f, t).ca * .5), odds: f.ops.rating < 1.8 ? .3 : .55 });
    }
  }
  for (const pr of S.props) {
    const lp = (m, k) => logP(pr, m, k, t);
    if (p(.006)) claim('immo', .03 * propValue(pr), t, `Dégât des eaux · ${propName(pr)}`, lp);
    else if (p(.0015)) { claim('immo', .2 * propValue(pr), t, `Incendie · ${propName(pr)}`, lp); if (pr.tenant) { lp(`${pr.tenant.n} quitte le logement sinistré.`, 'bad'); pr.tenant = null; pr.vacant = t; } }
  }
  for (const it of allItems()) if (S.owned[it[0]] && p(.0006)) {
    const val = ipx(it);
    if (it[4] === 'home') claim('lux', .05 * val, t, `Cambriolage dans votre résidence (${it[1]})`);
    else { delete S.owned[it[0]]; const back = S.ins.lux ? val * (1 - FRANCHISE) : 0; S.cash += back; lossLog(t, '🦹', `Vol : ${it[1]}`, val - back, S.ins.lux ? 'Assuré : vous avez été remboursé à 90 %.' : `Sans assurance, le bien est perdu. L’assurance des biens de luxe coûte ${eur(insCost('lux'))}/h.`); if (!simQuiet) toast(`Vol : ${it[1]} a disparu !${S.ins.lux ? ` L’assurance vous rembourse ${eur(back)}.` : ''}`, 'crash'); }
  }
  // Placements proposés dans les infos : arnaques et vraies opportunités
  for (const o of S.opps) if (o.amt && !o.done && o.payAt <= t) {
    o.done = 1;
    if (o.scam) lossLog(t, '🎣', `Arnaque « ${o.name} » : ${eur(o.amt)} perdus`, o.amt, 'Signes d’alerte : rendement énorme « garanti », urgence, parrainage, plateforme non autorisée par l’AMF.');
    else { const back = o.amt * (1 + o.ret), gain = back - o.amt, tax = Math.max(0, gain) * TAX; S.cash += back - tax; S.taxPaid += tax; if (gain < 0) lossLog(t, '📉', `${o.name} : ${eur(-gain)} perdus`, -gain, 'Un vrai placement comporte toujours un risque de perte.'); }

function bankruptcyCheck(f, net, dtH, t) {

  if (f.lossH < 4) f.warned = 0;
  if (f.lossH >= 16) {
    const back = f.s * .2; S.cash += back; f.bankrupt = 1;
    lossLog(t, '⚖️', `Faillite de ${firmName(f)}`, f.s - back, `L’entreprise a perdu de l’argent 16 h d’affilée. Ses biens ont été liquidés pour ${eur(back)}. Surveillez le bénéfice net : recrutez, ajustez vos prix ou revendez avant d’en arriver là.`);
    if (!simQuiet) toast(`Faillite : ${firmName(f)} ferme ses portes.`, 'crash');

// Chaque amélioration coûte 1,6 fois la précédente et se rembourse en un peu plus de temps que l'achat (15 h au plus).
const upCost = (d, l) => dc(d) * .6 * Math.pow(1.6, l - 1);   // passer du niveau l au niveau l + 1
const upPb = d => Math.min(15, d.pb * 1.2);
function netAt(d, l) { let n = dc(d) / d.pb; for (let i = 1; i < l; i++) n += upCost(d, i) / upPb(d); return n; }
// Postes : un par métier au départ, un de plus tous les deux niveaux.
const needAt = (d, l) => d.roles.length + Math.floor((l - 1) / 2);
function roleNeed(d, l, i) { const R = d.roles.length, extra = needAt(d, l) - R; let n = 1; for (let k = 0; k < extra; k++) if (k % R === i) n++; return n; }
// Comptes nominaux (équipe complète, compétence 2, humeur 75 %) : le bénéfice net vaut netAt().
const ca1 = d => dc(d) / d.pb / d.m;
const stockRate = d => (1 - d.m) * d.split[2];
const wage0 = d => ca1(d) * (1 - d.m) * d.split[0] / d.roles.length;
const rentAt = (d, l) => ca1(d) * (1 - d.m) * d.split[1] * SITES[l];
const caFull = (d, l) => (netAt(d, l) + rentAt(d, l) + wage0(d) * needAt(d, l)) / (1 - stockRate(d));
const mktWage = (d, sk) => wage0(d) * (.7 + .15 * sk);
// Le manager coûte 18 % du bénéfice normal de l'entreprise à son niveau actuel.
// Le manager coûte 1,5 fois le salaire moyen de l'équipe (ou du marché si l'équipe est vide) ; il apporte +10 % de productivité.
const mgrWage = f => { const n = f.staff.length; return 1.5 * (n ? f.staff.reduce((a, e) => a + e.sal, 0) / n : mktWage(bizById(f.t), 2)); };
function mgrImpact(f) { const t = Date.now(), n0 = firmStats(f, t).net; f.mgr = { n: '', sal: mgrWage(f) }; const n1 = firmStats(f, t).net; f.mgr = null; return n1 - n0; }
function book(d, l) {
  const ca = caFull(d, l);
  return { ca, sal: wage0(d) * needAt(d, l), rent: rentAt(d, l), stock: ca * stockRate(d), net: netAt(d, l) };
}

function firmStats(f, t = Date.now()) {
  const d = bizById(f.t), need = Math.max(1, needF(f)), strike = f.strike > t;
  if (!f.ops) opsInit(f, true);
  let eff = 0, sal = 0, mood = 0, present = 0;
  for (const e of f.staff) {
    mood += e.mood;
    if (strike) continue;
    if (isIn(e, t)) { eff += effOf(e); present++; }
    if (isIn(e, t) || (e.away.k !== 'sick' && e.away.k !== 'start')) sal += e.sal;   // arrêts maladie indemnisés par la Sécurité sociale ; pas de salaire avant l'arrivée
  }

  const cover = strike ? 0 : .6 * Math.max(0, need - present) / need * Math.min(1, present / need);

  const owner = d.solo && present < need ? .6 / need : 0;

}
// Valeur de revente : au moins 50 % de ce qui a été investi (achat + améliorations),

let simQuiet = false;

// Fait vivre une entreprise pendant dtH heures (jeu ouvert ou absence).
function simFirm(f, dtH, t, broke) {

function simAll(dtH, t) {

/* --- Ordres et transactions --- */
function execTrade(id, side, q, t = Date.now(), auto = false) {
  const isC = !!CBY[id], m = S.mk[id], book = isC ? S.crypto : S.stocks, own = book[id] || 0;
  if (!isC) q = Math.floor(q + 1e-9);
  if (side === 'sell') q = Math.min(q, own);
  if (!(q > 0)) return { ok: false, msg: side === 'sell' ? 'quantité insuffisante' : 'quantité nulle' };
  const r = quote(id, side, q, t);
  if (side === 'buy') {
    if (S.cash < r.total - 1e-9) return { ok: false, msg: 'fonds insuffisants' };
    S.cash -= r.total; book[id] = own + q; S.basis[id] = (S.basis[id] || 0) + r.total;
  } else {
    book[id] = own - q; S.basis[id] = (S.basis[id] || 0) - r.part;
    if (book[id] < 1e-9) { book[id] = 0; S.basis[id] = 0; }
    S.cash += r.gross - r.fee; payTax(r.tax); S.realized += r.gain;
  }
  // Le cours bouge pendant l'ordre, puis revient à la normale en quelques minutes.
  m.imp = (m.imp || 0) + Math.log(1 + (side === 'buy' ? 1 : -1) * r.imp);
  m.p = Math.max(1e-7, m.a * Math.exp(m.x + m.imp) * afx(id, t));
  // Aller-retours rapprochés sur le même actif : le courtage grimpe.
  const rt = S.rt[id] && t - S.rt[id].last <= 30 * 60e3 ? S.rt[id] : { n: 0, side: '' };
  if (rt.side && rt.side !== side) rt.n++;
  rt.side = side; rt.last = t; S.rt[id] = rt;
  const after = feeRate(id, t);
  if (after > r.rate && !simQuiet) setTimeout(() => toast(`Trading trop fréquent sur ${(SBY[id] || CBY[id]).n} : courtage porté à ${nf1.format(after * 100)} %. Retour à ${nf1.format((isC ? FEE_C : FEE_S) * 100)} % après 30 min sans transaction.`, 'crash'), 1800);
  S.trades.unshift([t, id, side, q, r.avg, r.fee, auto ? 1 : 0, r.tax || 0]);
  if (!auto) S.stats.trades++;
  if (S.trades.length > 200) S.trades.length = 200;

}

function divH() { let d = 0; for (const s of STOCKS) d += (S.stocks[s.id] || 0) * S.mk[s.id].p * s.y / 12; return d * (1 + collBonus()); }

function pfParts() {

function series(hs, ms, cur, mult = 1) {

  for (const [k] of HT) for (const pt of hs[k]) if (pt[0] >= from && pt[0] < now) all.push(pt);

    if (b === lastB) out[out.length - 1] = [pt[0], pt[1] * mult]; else { out.push([pt[0], pt[1] * mult]); lastB = b; }

}

  const d = pts.map(([t, v], i) => `${i ? 'L' : 'M'}${X(t).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
  return `<path d="${d}L${W} ${Hh}L0 ${Hh}Z" fill="${color}" fill-opacity=".13"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
}

function rivals() { const hrs = (Date.now() - S.started) / 36e5; return RIVALS.map(([n, f]) => [n, f * (1 + .0004 * hrs)]); }
function tier(f) { return f < 50000 ? 'Quartier' : f < 5e6 ? 'Ville' : f < 1e9 ? 'Région' : f < 50e9 ? 'Pays' : 'Monde'; }
function renderProfile() {
  const parts = fortuneParts(), total = Object.values(parts).reduce((a, b) => a + b, 0);
  let acc = 0;
  const R = 54, C = 2 * Math.PI * R;
  const arcs = CATS.filter(([k]) => parts[k] > 0).map(([k, , c]) => {
    const frac = parts[k] / (total || 1), dash = `${(frac * C).toFixed(2)} ${C.toFixed(2)}`, off = -acc * C;
    acc += frac;
    return `<circle cx="75" cy="75" r="${R}" fill="none" stroke="var(${c})" stroke-width="20" stroke-dasharray="${dash}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 75 75)"/>`;
  }).join('');
  const list = [...rivals(), [S.name + ' (vous)', total, true]].sort((a, b) => b[1] - a[1]);
  const myPos = list.findIndex(x => x[2]);
  // Tout le classement tient sur l'écran ; s'il s'allonge, « … » marque les rangs masqués.
  const show = list.map((x, i) => [i + 1, ...x]).filter((x, i) => list.length <= 12 || Math.abs(i - myPos) <= 3 || i < 3);
  const ahead = myPos > 0 ? list[myPos - 1] : null;
  const initials = (S.name || 'V').trim().slice(0, 1).toUpperCase();
  return `<section class="screen" id="scr">
    <div class="card fortune"><span class="avatar">${esc(initials)}</span>
      <input class="name-input" id="nameInput" maxlength="22" value="${esc(S.name)}" aria-label="Votre nom">
      <span class="label" style="margin-top:6px">Fortune totale</span><b class="num">${eur(total)}</b>
      <span class="muted">#${myPos + 1} du classement · niveau ${tier(total)}</span></div>
    <div class="card"><div class="row" style="margin-bottom:12px"><span class="label">Répartition</span></div>
      <div class="donut-wrap"><svg class="donut" viewBox="0 0 150 150" role="img" aria-label="Répartition de la fortune"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="20"/>${arcs}</svg>
        <ul class="legend">${CATS.map(([k, n, c]) => `<li style="--c:var(${c})"><i></i><span>${n}</span><b class="num">${eur(parts[k])}</b></li>`).join('')}</ul></div></div>
    <div class="card"><div class="row" style="margin-bottom:6px"><span class="label">Classement des plus riches</span>${ahead ? `<span class="muted">Prochain : <span class="nowrap">${eur(ahead[1] - total)}</span></span>` : ''}</div>
      <ol class="rank">${show.map(([pos, n, f, me], i) => `${i && pos - show[i - 1][0] > 1 ? '<li class="gap-row"><span class="gap">…</span></li>' : ''}<li class="${me ? 'me' : ''}"><span class="pos">${pos}</span><span>${esc(n)}</span><b class="num">${eur(f)}</b></li>`).join('')}</ol></div>
    <div class="card"><span class="label">Statistiques</span>
      <div class="stats" style="margin-top:10px">
        <div><small>Total gagné</small><b class="num">${eur(S.earned)}</b></div><div><small>Clics</small><b class="num">${nf0.format(S.clicks)}</b></div>
        <div><small>Revenu passif</small><b class="num"${negS(incomeH())}>${perH(incomeH())}</b></div><div><small>Temps de jeu</small><b class="num">${dur(S.playMs)}</b></div>
        <div><small>Impôts payés</small><b class="num">${eur(S.taxPaid)}</b></div><div><small>Inflation</small><b>${sgn(S.infl * 100)}/jour</b></div>
        <div><small>Indice des prix</small><b>×${nf2.format(S.pi)}</b></div><div><small>Plus-values réalisées</small><b class="num"${negS(S.realized)}>${eur(S.realized)}</b></div>
      </div></div>
    ${renderPrestige()}
    ${renderAch()}
    ${renderRisks(Date.now())}
    <button class="btn ghost full" id="resetBtn" type="button">Recommencer une partie</button>
  </section>`;
}

/* ================= Pubs récompensées ================= */
/* AdService choisit automatiquement le fournisseur présent sur la page. Sans SDK, une pub simulée de 30 s est affichée.
   Pour brancher un vrai réseau, ajoutez son script dans l'en-tête (voir le commentaire en haut du fichier). */
const AdService = {
  provider() {
    if (window.PokiSDK && typeof window.PokiSDK.rewardedBreak === 'function') return 'poki';
    if (window.CrazyGames && window.CrazyGames.SDK && window.CrazyGames.SDK.ad) return 'crazygames';
    if (typeof window.adBreak === 'function') return 'google';
    return 'simulated';
  },
  /* Renvoie une promesse : true si la pub a été vue jusqu'au bout et que la récompense doit être donnée. */
  showRewarded(what) {
    const p = this.provider();
    if (p === 'poki') return window.PokiSDK.rewardedBreak().then(ok => !!ok).catch(() => false);
    if (p === 'crazygames') return new Promise(res => window.CrazyGames.SDK.ad.requestAd('rewarded', { adFinished: () => res(true), adError: () => res(false) }));
    if (p === 'google') return new Promise(res => {
      let done = false; const end = v => { if (!done) { done = true; res(v); } };
      window.adBreak({ type: 'reward', name: 'boost_clics', beforeReward: show => show(), adViewed: () => end(true), adDismissed: () => end(false), adBreakDone: () => end(false) });
    });
    return this.simulate(what);
  },
  simulate(what) {
    return new Promise(res => {
      let left = AD_SECONDS;
      modal(`<div class="ad-screen"><small>Publicité</small><span class="ad-count" id="adCount">${left} s</span><b>Votre pub ici</b><span class="ad-progress" id="adProg" style="width:0%"></span></div>
        <p>Restez jusqu’à la fin pour recevoir ${what || `votre bonus x${BOOST_MULT} pendant ${BOOST_MS / 1000} secondes`}.</p>
        <button class="btn ghost full" id="adClose" type="button">Fermer sans bonus</button>`);
      const t = setInterval(() => {
        left--;
        const c = $('adCount'), pr = $('adProg');
        if (c) c.textContent = left > 0 ? `${left} s` : 'Terminé';
        if (pr) pr.style.width = ((AD_SECONDS - left) / AD_SECONDS * 100) + '%';
        if (left <= 0) { clearInterval(t); closeModal(); res(true); }
      }, 1000);
      $('adClose').onclick = () => { clearInterval(t); closeModal(); res(false); };
    });
  },
};
let adBusy = false;
// Bouton grisé pendant le bonus, puis 5 minutes d'attente entre deux pubs.
const adLocked = () => adBusy || boosted() || Date.now() < S.adNext;
const adLabel = () => boosted() ? `Actif encore ${mmss(S.boostUntil - Date.now())}` : Date.now() < S.adNext ? `Prochaine pub dans ${mmss(S.adNext - Date.now())}` : `Regardez une pub de ${AD_SECONDS} s · ${BOOST_MS / 1000} s de bonus`;
async function watchAd() {
  if (adLocked()) return;
  adBusy = true;
  const ok = await AdService.showRewarded();
  adBusy = false;
  if (ok) { S.stats.ads++; S.boostUntil = Date.now() + BOOST_MS; S.adNext = Date.now() + AD_COOLDOWN; toast(`Bonus x${BOOST_MULT} activé pendant ${BOOST_MS / 1000} secondes !`, 'good'); save(); }
  else toast('Pub interrompue : pas de bonus cette fois.');
  render();
}

  const nb = document.querySelector('.nav [data-tab="biz"]');

  if ((!canBiz || tab === 'biz') && dot) dot.remove();
}

let lastFrame = Date.now(), lastTick = Date.now(), lastSave = Date.now();
function loop() {
  if (document.hidden) return;   // l'absence est rattrapée par offlineGains() au retour
  const now = Date.now(), dt = now - lastFrame;
  lastFrame = now;
  if (dt > 0 && dt < 5000) { simAll(dt / H, now); S.playMs += dt; }
  if (now - lastTick >= TICK_MS) {
    lastTick = now; marketTick(false); updateInvest(); maybeEvent(now); maybeInfo(now); checkDaily(); checkQuests(); checkAch(); checkUnlocks(); maybePending();
    if (tab === 'creator' && S.cr && $('modal').hidden) {
      const c = S.cr, cs = `${c.vids.length}:${c.n}:${c.offers.length}:${!!c.prod}:${c.log[0] ? c.log[0][0] : 0}:${c.burn > now}:${crView}:${crSort}:${crTab}:${crMet}:${Math.floor(now / (crView ? 1e4 : 2e4))}`;
      if (cs !== renderCreator.sig) { renderCreator.sig = cs; render(); }
      else { const el = $('crSubs'); if (el) el.textContent = nf0.format(c.subs); if ($('cv-cr')) chartUpdate('cr', crSeries(c)); }
    }
    if (tab === 'news' && S.info.length && S.info[0].id !== renderNews.last) { renderNews.last = S.info[0].id; render(); }
    // Les écrans Entreprises se redessinent quand il se passe quelque chose dans une équipe.
    const sig = S.firms.map(f => `${f.u}:${f.l}:${f.staff.length}:${f.log[0] ? f.log[0][0] : 0}:${f.strike > now}:${f.staff.filter(e => !isIn(e, now)).length}`).join('|');
    if (tab === 'biz' && bizView === 'firm' && firmTab === 'ops') updOps();
    if (sig !== bizSig) { bizSig = sig; if (tab === 'biz' && bizView !== 'found' && $('modal').hidden) render(); }
  }
  if (now - lastSave >= 5000) { lastSave = now; save(); }
  refresh();
}

function updOps() {

  $('kCa').textContent = eur(em.ca); $('kCli').textContent = nf0.format(em.n); $('kLost').textContent = nf0.format(em.lost); $('kSat').textContent = Math.round(st.ops.sat * 100) + ' %';

/* Gains pendant l'absence (plafonnés à 8 h) : les entreprises et leurs équipes continuent de vivre. */
function offlineGains() {
  const now = Date.now(), away = now - (S.last || now);
  if (away < 15000) return;
  marketAdvance(away, now);
  const hrs = Math.min(away / H, OFFLINE_CAP_H), steps = Math.max(1, Math.ceil(hrs / .1)), dtH = hrs / steps, t0 = now - hrs * H;
  const cash0 = S.cash, logs0 = S.firms.reduce((a, f) => a + f.log.filter(l => l[0] > S.last).length, 0);
  simQuiet = true;
  for (let i = 1; i <= steps; i++) simAll(dtH, t0 + i * dtH * H);
  simQuiet = false;
  lastFrame = now;
  const g = S.cash - cash0, news = S.firms.reduce((a, f) => a + f.log.filter(l => l[0] > S.last).length, 0) - logs0;
  if (Math.abs(g) < .01 && !news) return;
  const who = S.name && S.name !== 'Vous' ? `, ${esc(S.name)}` : '';
  modal(`<div class="welcome"><span class="ev-ico">👋</span><h3>Bon retour${who} !</h3><p>Pendant votre absence (${dur(away)}${away / H > OFFLINE_CAP_H ? `, dont ${OFFLINE_CAP_H} h comptées` : ''}), vous avez ${g >= 0 ? 'gagné' : 'perdu'} :</p>
    <span class="big num"${g < 0 ? ' style="color:var(--neg)"' : ''}>${eur(Math.abs(g))}</span>${news ? `<p>${news} événement${news > 1 ? 's' : ''} dans vos équipes : consultez les journaux de vos entreprises.</p>` : ''}</div><div class="modal-actions"><button class="btn go" id="okBack" type="button">Récupérer</button></div>`);
  $('okBack').onclick = () => { closeModal(); render(); };
}

  if (testTaps < 5) return;
  testTaps = 0;
  modal(`<h3>Mode test</h3><p>Ajoute de l’argent sur votre solde pour essayer le jeu.</p><div class="modal-actions"><button class="btn ghost" id="mNo" type="button">Fermer</button><button class="btn tok" id="mTok" type="button">+100 💠</button><button class="btn go" id="mYes" type="button">+9 Md€</button></div>`);
  $('mTok').onclick = () => { giveTok(100, 'Mode test'); closeModal(); afterAction(); toast('Mode test : 100 jetons ajoutés.', 'good'); };
  $('mNo').onclick = closeModal;
  $('mYes').onclick = () => { S.cash += 9e9; closeModal(); afterAction(); toast('Mode test : 9 milliards ajoutés.', 'good'); };
});
$('main').addEventListener('input', e => {
  if (e.target.id === 'crName') newName = e.target.value; if (e.target.id === 'amtIn') { tAmt = parseFloat(e.target.value) || 0; updTrade(); } });
$('main').addEventListener('pointermove', chartHover);
$('main').addEventListener('pointerleave', () => document.querySelectorAll('.chart .ctip, .chart .cline').forEach(el => el.hidden = true));
$('main').addEventListener('change', e => {
  if (e.target.dataset.ins) { S.ins[e.target.dataset.ins] = e.target.checked; toast(e.target.checked ? `Assurance ${INS[e.target.dataset.ins][0].toLowerCase()} souscrite.` : 'Assurance résiliée.'); return afterAction(); }
  if (e.target.dataset.auto != null) { const f = findFirm(firmU); if (f) { f.ops.auto = e.target.checked; afterAction(); } return; }
  if (e.target.id === 'nameInput') { S.name = e.target.value.trim().slice(0, 22) || 'Vous'; afterAction(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { offlineGains(); lastFrame = Date.now(); } });
window.addEventListener('pagehide', save);

/* ================= Démarrage ================= */
const VERSION = 'v1.0';
let splashOn = true;
function runSplash() {
  $('spVer').textContent = VERSION;
  const msgs = ['Ouverture des marchés…', 'Calcul de vos gains hors ligne…', 'Préparation de vos entreprises…'], el = $('spMsg');
  msgs.slice(1).forEach((m, i) => setTimeout(() => { el.classList.add('swap'); setTimeout(() => { el.textContent = m; el.classList.remove('swap'); }, 250); }, 800 * (i + 1)));
  setTimeout(() => { $('splash').classList.add('gone'); splashOn = false; setTimeout(() => $('splash').remove(), 600); }, 2600);
}
function start() {
  runSplash();
  if (!load()) { S = defaultState(); S.pending.push({ k: 'tuto' }); }
  else offlineGains();
  render();
  save();
  setInterval(loop, 250);
}
start();
})();
</script>
</body>
